<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=" device-width, initial-scale="1.0" />
    <title>Unang Blockchain ni Mayor R Jay</title>
    <!--connects the CSS file -->
    <link rel="stylesheet" href="css/sim.css" />
  </head>
  <body>
    <!-- Main container -->
    <div class="container">
      <!-- Main title -->
      <h1>Ang Unang Blockchain ni Mayor R Jay</h1>
      <p class="subtitle">
        Add blocks, Inspect hashes, and see how tampering works in PB
      </p>

      <!-- Block controls -->
      <section class="controls">
        <!-- Input for block data -->
        <input id="blockData" type="text" placeholder="Enter a Block Data" />
        <!-- Button for adding a new block -->
        <button id="addBlockBtn">Add Block</button>
        <!-- Button for checking the blockchain -->
        <button id="validateBtn">Validate Chain</button>
      </section>

      <!-- Section where the blockchain blocks are displayed -->
      <section>
        <div id="chain" class="chain"></div>
      </section>

      <!-- Blockchain status section -->
      <section>
        <h2>Chain Status</h2>
        <div id="status" class="status valid">Chain is Valid</div>
      </section>
    </div>

    <!--Cloudfare Crypto Library-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="js/sim.js"></script>
  </body>
</html>
